name: Deploy to droplet

# Авто-деплой при пуше в main (или вручную). По SSH: git reset, пересборка,
# подстановка LLM-провайдеров в .env из секретов, переиндексация (если менялись
# data/ingestion), прогрев. Затем отдельная job eval (не блокирует деплой).
#
# Секреты деплоя: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_PATH, (опц.) DEPLOY_PORT
# Секреты LLM: Gemini_API_Key (основной сейчас); для Azure (без лимита, станет
#   главным): AZURE_OPENAI_ENDPOINT, AZURE_OPENAI_KEY, AZURE_OPENAI_DEPLOYMENT
#   Failover: Azure -> Gemini -> GitHub Models (github_token уже в .env).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GROQ_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_KEY: ${{ secrets.Gemini_API_Key }}
          AZ_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZ_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
          AZ_DEPLOY: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
          WA_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WA_VERIFY: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
          WA_PNID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WA_APP_SECRET: ${{ secrets.WHATSAPP_APP_SECRET }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 30m
          envs: GROQ_KEY,OPENAI_KEY,GEMINI_KEY,AZ_ENDPOINT,AZ_KEY,AZ_DEPLOY,WA_TOKEN,WA_VERIFY,WA_PNID,WA_APP_SECRET,ADMIN_PASSWORD,ADMIN_USER
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"

            OLD=$(git rev-parse HEAD)
            git fetch origin main
            git reset --hard origin/main
            NEW=$(git rev-parse HEAD)

            # --- configure LLM providers in .env (managed block) ---
            ENVF=.env; touch "$ENVF"
            sed -i '/^LLM_BASE_URL=/d;/^LLM_MODEL=/d;/^LLM_API_KEY=/d;/^LLM_FALLBACK_BASE_URL=/d;/^LLM_FALLBACK_MODEL=/d;/^LLM_FALLBACK_API_KEY=/d;/^LLM_AZURE_ENDPOINT=/d;/^LLM_AZURE_API_KEY=/d;/^LLM_AZURE_DEPLOYMENT=/d' "$ENVF"
            PRIMARY=""
            # Primary: OpenAI (best ru/ky grounding) > Groq > Gemini
            if [ -n "${OPENAI_KEY:-}" ]; then
              { echo "LLM_BASE_URL=https://api.openai.com/v1";
                echo "LLM_MODEL=gpt-4o-mini";
                echo "LLM_API_KEY=${OPENAI_KEY}"; } >> "$ENVF"
              echo ">> OpenAI configured as primary"; PRIMARY=openai
            elif [ -n "${GROQ_KEY:-}" ]; then
              { echo "LLM_BASE_URL=https://api.groq.com/openai/v1";
                echo "LLM_MODEL=llama-3.3-70b-versatile";
                echo "LLM_API_KEY=${GROQ_KEY}"; } >> "$ENVF"
              echo ">> Groq configured as primary"; PRIMARY=groq
            elif [ -n "${GEMINI_KEY:-}" ]; then
              { echo "LLM_BASE_URL=https://generativelanguage.googleapis.com/v1beta/openai/";
                echo "LLM_MODEL=gemini-2.0-flash";
                echo "LLM_API_KEY=${GEMINI_KEY}"; } >> "$ENVF"
              echo ">> Gemini configured as primary"; PRIMARY=gemini
            fi
            # Fallback: Groq (unless it is already the primary)
            if [ -n "${GROQ_KEY:-}" ] && [ "$PRIMARY" != "groq" ]; then
              { echo "LLM_FALLBACK_BASE_URL=https://api.groq.com/openai/v1";
                echo "LLM_FALLBACK_MODEL=llama-3.3-70b-versatile";
                echo "LLM_FALLBACK_API_KEY=${GROQ_KEY}"; } >> "$ENVF"
              echo ">> Groq configured as fallback"
            fi
            if [ -n "${AZ_ENDPOINT:-}" ] && [ -n "${AZ_KEY:-}" ] && [ -n "${AZ_DEPLOY:-}" ]; then
              { echo "LLM_AZURE_ENDPOINT=${AZ_ENDPOINT}";
                echo "LLM_AZURE_API_KEY=${AZ_KEY}";
                echo "LLM_AZURE_DEPLOYMENT=${AZ_DEPLOY}"; } >> "$ENVF"
              echo ">> Azure OpenAI configured as TOP primary"
            fi

            # --- WhatsApp Cloud API channel (managed block) ---
            sed -i '/^WHATSAPP_TOKEN=/d;/^WHATSAPP_VERIFY_TOKEN=/d;/^WHATSAPP_PHONE_NUMBER_ID=/d;/^WHATSAPP_APP_SECRET=/d' "$ENVF"
            [ -n "${WA_TOKEN:-}" ]      && echo "WHATSAPP_TOKEN=${WA_TOKEN}" >> "$ENVF"
            [ -n "${WA_VERIFY:-}" ]     && echo "WHATSAPP_VERIFY_TOKEN=${WA_VERIFY}" >> "$ENVF"
            [ -n "${WA_PNID:-}" ]       && echo "WHATSAPP_PHONE_NUMBER_ID=${WA_PNID}" >> "$ENVF"
            [ -n "${WA_APP_SECRET:-}" ] && echo "WHATSAPP_APP_SECRET=${WA_APP_SECRET}" >> "$ENVF"
            [ -n "${WA_VERIFY:-}" ] && echo ">> WhatsApp channel configured"

            # --- Admin logs login (managed block) ---
            sed -i '/^ADMIN_PASSWORD=/d;/^ADMIN_USER=/d' "$ENVF"
            [ -n "${ADMIN_PASSWORD:-}" ] && echo "ADMIN_PASSWORD=${ADMIN_PASSWORD}" >> "$ENVF"
            [ -n "${ADMIN_USER:-}" ]     && echo "ADMIN_USER=${ADMIN_USER}" >> "$ENVF"
            [ -n "${ADMIN_PASSWORD:-}" ] && echo ">> Admin login configured"

            docker compose up -d --build --force-recreate backend
            docker compose up -d qdrant openwebui

            if [ "$OLD" = "$NEW" ] || ! git diff --quiet "$OLD" "$NEW" -- data ingestion; then
              echo ">> data/ или ingestion/ изменились — переиндексация Qdrant"
              docker compose run --rm backend python -m ingestion.ingest --recreate
            else
              echo ">> изменений в данных нет — переиндексация пропущена"
            fi

            echo ">> warmup (триггерим загрузку моделей)"
            sleep 3
            curl -s -m 600 -o /dev/null -w "warmup HTTP %{http_code}\n" \
              http://localhost:8000/v1/chat/completions \
              -H 'Content-Type: application/json' \
              -d '{"model":"alatoo-rag","stream":false,"messages":[{"role":"user","content":"тест"}]}' || true

            # --- health gate: битый бэкенд ДОЛЖЕН валить деплой (и сразу видно) ---
            echo ">> health gate: ждём /healthz = 200"
            ok=0
            for i in $(seq 1 30); do
              code=$(curl -s -m 10 -o /dev/null -w "%{http_code}" http://localhost:8000/healthz || true)
              if [ "$code" = "200" ]; then ok=1; echo ">> healthz OK (попытка $i)"; break; fi
              echo ">> healthz=$code — ждём… ($i/30)"; sleep 5
            done
            docker compose ps
            if [ "$ok" != "1" ]; then
              echo "!! Бэкенд не отвечает 200 на /healthz — деплой провален. Логи backend:"
              docker compose logs --tail=80 backend || true
              exit 1
            fi
            echo ">> деплой здоров: /healthz=200"

  eval:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run regression eval against production
        run: python eval/qa_eval.py --base https://chat.alatoogpt.xyz --threshold 0.9
