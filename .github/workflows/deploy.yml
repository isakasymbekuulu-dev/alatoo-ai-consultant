name: Deploy to droplet

# Авто-деплой при пуше в main (или вручную через "Run workflow").
# Заходит на сервер по SSH, подтягивает свежий код, пересобирает контейнеры
# и переиндексирует базу знаний в Qdrant — только если менялись data/ или ingestion/.
#
# Секреты (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_PATH, (опц.) DEPLOY_PORT

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"

            OLD=$(git rev-parse HEAD)
            git fetch origin main
            git reset --hard origin/main
            NEW=$(git rev-parse HEAD)

            docker compose up -d --build

            if [ "$OLD" = "$NEW" ] || ! git diff --quiet "$OLD" "$NEW" -- data ingestion; then
              echo ">> data/ или ingestion/ изменились — переиндексация Qdrant"
              docker compose run --rm backend python -m ingestion.ingest --recreate
            else
              echo ">> изменений в данных нет — переиндексация пропущена"
            fi

            # Прогрев: первый запрос грузит dense+sparse+reranker (и качает модели),
            # чтобы пользователи и eval-job не ловили холодный старт. -m 600 — на случай
            # первой загрузки модели реранкера.
            echo ">> warmup (load dense+sparse+reranker models)"
            sleep 3
            curl -s -m 600 -o /dev/null -w "warmup HTTP %{http_code}\n" \
              http://localhost:8000/v1/chat/completions \
              -H 'Content-Type: application/json' \
              -d '{"model":"alatoo-rag","stream":false,"messages":[{"role":"user","content":"тест"}]}' || true

            docker compose ps

  # Регрессионный eval после деплоя. Бежит на раннере GitHub (он достаёт прод),
  # отдельная job — НЕ блокирует деплой. Краснеет при просадке качества.
  eval:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run regression eval against production
        run: python eval/qa_eval.py --base https://chat.alatoogpt.xyz --threshold 0.9
