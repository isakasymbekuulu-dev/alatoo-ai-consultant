name: Deploy to droplet

# Авто-деплой при пуше в main (или вручную через "Run workflow").
# Заходит на сервер по SSH, подтягивает свежий код, пересобирает контейнеры
# и переиндексирует базу знаний в Qdrant — только если менялись data/ или ingestion/.
#
# Нужно один раз добавить секреты в репозитории:
#   Settings → Secrets and variables → Actions → New repository secret
#     DEPLOY_HOST      — IP или домен дроплета (напр. 203.0.113.10)
#     DEPLOY_USER      — пользователь SSH (напр. root или deploy)
#     DEPLOY_SSH_KEY   — приватный SSH-ключ целиком (BEGIN ... END), у которого
#                        публичная часть лежит в ~/.ssh/authorized_keys на сервере
#     DEPLOY_PATH      — путь к репозиторию на сервере (напр. /opt/alatoo-ai-consultant)
#     DEPLOY_PORT      — (необязательно) SSH-порт, по умолчанию 22

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"

            OLD=$(git rev-parse HEAD)
            git fetch origin main
            git reset --hard origin/main
            NEW=$(git rev-parse HEAD)

            # пересобрать и поднять backend (+ qdrant, openwebui)
            docker compose up -d --build

            # переиндексировать только при изменениях в данных или пайплайне ingestion
            if [ "$OLD" = "$NEW" ] || ! git diff --quiet "$OLD" "$NEW" -- data ingestion; then
              echo ">> data/ или ingestion/ изменились — переиндексация Qdrant"
              docker compose run --rm backend python -m ingestion.ingest --recreate
            else
              echo ">> изменений в данных нет — переиндексация пропущена"
            fi

            docker compose ps

  # Регрессионный eval после деплоя. Бежит на раннере GitHub (он достаёт прод),
  # отдельная job — НЕ блокирует деплой (тот уже применён в job `deploy`).
  # Краснеет, если качество ответов просело ниже порога — регрессия видна сразу.
  eval:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Warm up backend (model load on first query)
        run: sleep 25
      - name: Run regression eval against production
        run: python eval/qa_eval.py --base https://chat.alatoogpt.xyz --threshold 0.9
