<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>AlaToo — журнал диалогов</title>
<style>
:root{--bg:#0d0d0d;--side:#171717;--surf:#1e1e1e;--surf2:#262626;--line:#2b2b2b;--txt:#ececec;--mut:#9a9a9a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--txt);height:100vh;display:flex;overflow:hidden}
.side{width:330px;flex:0 0 auto;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column}
.sh{padding:15px 16px 10px}
.sh h1{font-size:15px;font-weight:600}
.sh .st{font-size:12px;color:var(--mut);margin-top:3px}
.search{margin:0 12px 8px;display:flex;align-items:center;gap:8px;background:var(--surf);border:1px solid var(--line);border-radius:9px;padding:8px 11px}
.search svg{color:var(--mut)}.search input{flex:1;background:none;border:0;outline:0;color:var(--txt);font-size:13.5px}
.search input::placeholder{color:#7c7c7c}
.list{flex:1;overflow-y:auto;padding:4px 8px 12px}
.chat{padding:10px 12px;border-radius:9px;cursor:pointer;margin-bottom:2px}
.chat:hover{background:var(--surf)}.chat.on{background:var(--surf2)}
.chat .t{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat .m{font-size:11.5px;color:var(--mut);margin-top:3px;display:flex;gap:8px;align-items:center}
.tag{font-size:10.5px;border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:#bdbdbd}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.mh{padding:14px 20px;border-bottom:1px solid var(--line);font-size:14px;font-weight:500;display:flex;gap:10px;align-items:center}
.mh .sub{font-size:12px;color:var(--mut);font-weight:400}
.scroll{flex:1;overflow-y:auto;padding:20px}
.col{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:11px}.row.me{flex-direction:row-reverse}
.av{width:28px;height:28px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;font-size:11px;font-weight:600}
.av.ai{background:#ececec;color:#111}.av.me{background:#3a3a3a;color:#ddd}
.bub{max-width:80%;font-size:14.5px;line-height:1.65;border-radius:13px;padding:11px 14px}
.bub.me{background:var(--surf2)}.bub.ai{background:var(--surf);border:1px solid var(--line)}
.bub.ai h4{font-size:14px;font-weight:600;margin:11px 0 4px}.bub.ai ul{margin:4px 0;padding-left:19px}.bub.ai li{margin:3px 0}.bub.ai strong{color:#fff}
.src{margin-top:9px;font-size:11.5px;color:var(--mut);border-top:1px solid var(--line);padding-top:7px}
.empty{flex:1;display:grid;place-items:center;color:var(--mut);font-size:14px}
.ts{font-size:11px;color:#6f6f6f;text-align:center;margin:2px 0}
@media(max-width:720px){.side{width:46%}}
</style></head><body>
<aside class="side">
  <div class="sh"><h1>Журнал диалогов</h1><div class="st" id="stat">загрузка…</div></div>
  <div class="search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3-3"/></svg>
    <input id="q" placeholder="Поиск по чатам…"/></div>
  <div class="list" id="list"></div>
</aside>
<main class="main">
  <div class="mh" id="mh"><span>Выберите диалог</span></div>
  <div class="scroll"><div class="col" id="col"><div class="empty" id="empty">← выберите диалог слева</div></div></div>
</main>
<script>
const token=new URLSearchParams(location.search).get('token')||'';
const listEl=document.getElementById('list'),colEl=document.getElementById('col'),
      mh=document.getElementById('mh'),statEl=document.getElementById('stat'),qEl=document.getElementById('q');
let all=[],cur=null;
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function md(t){let s=esc(t);
  s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  const L=s.split('\n');let o=[],ul=false;const c=()=>{if(ul){o.push('</ul>');ul=false;}};
  for(const ln of L){const x=ln.trim();if(!x){c();continue;}let m;
    if(m=x.match(/^#{1,6}\s+(.*)/)){c();o.push('<h4>'+m[1]+'</h4>');}
    else if(m=x.match(/^[-•]\s+(.*)/)){if(!ul){o.push('<ul>');ul=true;}o.push('<li>'+m[1]+'</li>');}
    else{c();o.push('<p>'+x+'</p>');}}
  c();return o.join('');}
function fmt(ts){return (ts||'').replace('T',' ').replace('Z','');}
async function load(){
  const r=await fetch('/admin/api/sessions?token='+encodeURIComponent(token));
  if(!r.ok){statEl.textContent='нет доступа (проверьте токен)';return;}
  const d=await r.json();all=d.sessions||[];
  statEl.textContent=`${d.sessions} сессий · ${d.messages} сообщений`;
  render();
}
function render(){
  const f=qEl.value.trim().toLowerCase();
  const items=all.filter(s=>!f||(s.title||'').toLowerCase().includes(f));
  listEl.innerHTML=items.map(s=>`<div class="chat" data-id="${esc(s.session_id)}">
    <div class="t">${esc(s.title||'(без вопроса)')}</div>
    <div class="m"><span class="tag">${esc(s.source)}</span><span>${fmt(s.last_ts)}</span><span>· ${s.n} реплик</span></div></div>`).join('')
    || '<div style="padding:14px;color:#7c7c7c;font-size:13px">Ничего не найдено</div>';
}
async function open(id,title){
  cur=id;[...listEl.children].forEach(c=>c.classList.toggle('on',c.dataset.id===id));
  mh.innerHTML=`<span>${esc(title)}</span>`;
  const r=await fetch('/admin/api/session?token='+encodeURIComponent(token)+'&id='+encodeURIComponent(id));
  const d=await r.json();const msgs=d.messages||[];
  colEl.innerHTML=msgs.map(m=>{
    let srcs='';try{srcs=(JSON.parse(m.sources||'[]')).map(x=>x.source).filter(Boolean).join(', ');}catch(e){}
    return `<div class="ts">${fmt(m.ts)}</div>
      <div class="row me"><div class="av me">Аб</div><div class="bub me">${esc(m.user_msg)}</div></div>
      <div class="row"><div class="av ai">AI</div><div class="bub ai">${md(m.assistant_msg)}${srcs?`<div class="src">Источники: ${esc(srcs)}</div>`:''}</div></div>`;
  }).join('')||'<div class="empty">пусто</div>';
}
listEl.addEventListener('click',e=>{const c=e.target.closest('.chat');if(c){const s=all.find(x=>x.session_id===c.dataset.id);open(c.dataset.id,s?.title||'Диалог');}});
qEl.addEventListener('input',render);
load();
</script>
</body></html>
