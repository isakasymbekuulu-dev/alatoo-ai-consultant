<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI-консультант Ала-Тоо Университета</title>
<style>
  :root { --brand:#0a4d8c; --brand2:#1769b5; --bg:#f4f6fb; --bubble:#fff; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
         background:var(--bg); color:#1a1a1a; height:100vh; display:flex; flex-direction:column; }
  header { background:var(--brand); color:#fff; padding:14px 18px; display:flex; align-items:center; gap:10px; }
  header .dot { width:10px; height:10px; border-radius:50%; background:#5dd47e; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  #chat { flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:12px; }
  .msg { max-width:760px; padding:12px 14px; border-radius:14px; line-height:1.5; white-space:pre-wrap; word-wrap:break-word; }
  .user { align-self:flex-end; background:var(--brand2); color:#fff; border-bottom-right-radius:4px; }
  .bot  { align-self:flex-start; background:var(--bubble); border:1px solid #e3e7ef; border-bottom-left-radius:4px; }
  .hint { align-self:center; color:#778; font-size:13px; text-align:center; max-width:560px; }
  form { display:flex; gap:8px; padding:12px; background:#fff; border-top:1px solid #e3e7ef; }
  #q { flex:1; padding:12px 14px; border:1px solid #cfd6e4; border-radius:12px; font-size:15px; outline:none; }
  #q:focus { border-color:var(--brand2); }
  button { background:var(--brand); color:#fff; border:0; border-radius:12px; padding:0 20px; font-size:15px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:6px; }
  .chip { background:#e8eefa; color:var(--brand); border:0; border-radius:20px; padding:8px 12px; font-size:13px; cursor:pointer; }
</style>
</head>
<body>
  <header><span class="dot"></span><h1>AI-консультант Ала-Тоо Университета</h1></header>
  <div id="chat">
    <div class="hint">
      Здравствуйте! Я помогу с вопросами о поступлении, программах и факультетах.<br/>Задайте вопрос на кыргызском, русском или английском.
      <div class="chips">
        <button class="chip">Какие есть факультеты?</button>
        <button class="chip">Как поступить?</button>
        <button class="chip">Сколько стоит обучение?</button>
      </div>
    </div>
  </div>
  <form id="f">
    <input id="q" autocomplete="off" placeholder="Напишите вопрос…" />
    <button id="send" type="submit">Отправить</button>
  </form>

<script>
const chat = document.getElementById('chat');
const form = document.getElementById('f');
const input = document.getElementById('q');
const sendBtn = document.getElementById('send');
const history = [];

function bubble(text, who) {
  const d = document.createElement('div');
  d.className = 'msg ' + who;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

async function ask(question) {
  bubble(question, 'user');
  history.push({ role: 'user', content: question });
  const out = bubble('…', 'bot');
  sendBtn.disabled = true;

  try {
    const resp = await fetch('/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: 'alatoo-rag', stream: true, messages: history }),
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);

    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let acc = '', buf = '';
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) {
        const s = line.trim();
        if (!s.startsWith('data:')) continue;
        const payload = s.slice(5).trim();
        if (payload === '[DONE]') continue;
        try {
          const j = JSON.parse(payload);
          const tok = j.choices?.[0]?.delta?.content || '';
          if (tok) { acc += tok; out.textContent = acc; chat.scrollTop = chat.scrollHeight; }
        } catch (e) {}
      }
    }
    history.push({ role: 'assistant', content: acc });
  } catch (e) {
    out.textContent = 'Извините, произошла ошибка. Попробуйте ещё раз.';
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const q = input.value.trim();
  if (!q) return;
  input.value = '';
  ask(q);
});
document.querySelectorAll('.chip').forEach((c) =>
  c.addEventListener('click', () => ask(c.textContent)));
</script>
</body>
</html>
