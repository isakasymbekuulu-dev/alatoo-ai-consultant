<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>AlaToo — консоль оператора</title>
<style>
:root{--bg:#0d0d0d;--side:#171717;--surf:#1e1e1e;--surf2:#262626;--line:#2b2b2b;--txt:#ececec;--mut:#9a9a9a;--accent:#3a7afe}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--txt);height:100vh;display:flex;overflow:hidden}
.side{width:340px;flex:0 0 auto;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column}
.sh{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sh h1{font-size:15px;font-weight:600}
.sh .st{font-size:12px;color:var(--mut);margin-top:4px}
.sh a{color:var(--mut);font-size:12px;text-decoration:none}
.list{flex:1;overflow-y:auto;padding:6px 8px 12px}
.it{padding:10px 12px;border-radius:10px;cursor:pointer;margin-bottom:4px;border:1px solid transparent}
.it:hover{background:var(--surf)}.it.on{background:var(--surf2);border-color:var(--line)}
.it.unh{border-left:3px solid #e0a23c}
.it .t{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .m{font-size:11px;color:var(--mut);margin-top:5px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.it .rs{font-size:11.5px;color:#d7b78a;margin-top:5px;line-height:1.4}
.tag{font-size:10px;border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:#bdbdbd}
.b{font-size:10px;border-radius:5px;padding:1px 6px}
.b.p2{background:#5a2330;color:#ffb4b4}.b.p1{background:#5a4220;color:#f0c887}.b.p0{background:#274a3a;color:#9fe0c0}
.b.auto{background:#2f2a44;color:#c3b8f0}.b.man{background:#3a3a3a;color:#cfcfcf}
.b.human{background:#23405a;color:#9fcbea}.b.done{background:#2a2a2a;color:#8a8a8a}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.mh{padding:11px 16px;border-bottom:1px solid var(--line);display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.mh .ti{font-size:14px;font-weight:500;margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40%}
.btn{font-size:12.5px;border:1px solid var(--line);background:var(--surf);color:var(--txt);border-radius:8px;padding:6px 11px;cursor:pointer}
.btn:hover{background:var(--surf2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.warn{background:#5a2a2a;border-color:#7a3a3a;color:#ffcaca}
select{font-size:12.5px;background:var(--surf);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:6px}
.scroll{flex:1;overflow-y:auto;padding:18px}
.col{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:13px}
.row{display:flex;gap:10px}.row.me{flex-direction:row-reverse}
.av{width:26px;height:26px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;font-size:10px;font-weight:600}
.av.ai{background:#ececec;color:#111}.av.me{background:#3a3a3a;color:#ddd}.av.op{background:#23405a;color:#cde6fb}
.bub{max-width:78%;font-size:14px;line-height:1.6;border-radius:12px;padding:10px 13px;white-space:pre-wrap;word-break:break-word}
.bub.me{background:var(--surf2)}.bub.ai{background:var(--surf);border:1px solid var(--line)}
.bub.op{background:#16314a;border:1px solid #23506f}
.who{font-size:10.5px;color:var(--mut);margin-bottom:3px}
.ts{font-size:10.5px;color:#6f6f6f;text-align:center;margin:2px 0}
.empty{flex:1;display:grid;place-items:center;color:var(--mut);font-size:14px;text-align:center;padding:0 20px}
.composer{border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:9px;align-items:flex-end}
.composer textarea{flex:1;resize:none;min-height:42px;max-height:160px;background:var(--surf);border:1px solid var(--line);border-radius:10px;color:var(--txt);font-size:14px;padding:10px 12px;font-family:inherit}
.composer .hint{font-size:11px;color:var(--mut);margin-top:4px}
.locked{padding:10px 14px;border-top:1px solid var(--line);color:var(--mut);font-size:12.5px;text-align:center}
</style></head><body>
<aside class="side">
  <div class="sh"><h1>Консоль оператора</h1><div class="st" id="stat">загрузка…</div>
    <div style="margin-top:6px"><a href="/admin/logs">← к журналу диалогов</a></div></div>
  <div class="list" id="list"></div>
</aside>
<main class="main">
  <div class="mh" id="mh"><span class="ti">Выберите диалог</span></div>
  <div class="scroll"><div class="col" id="col"><div class="empty">← слева очередь диалогов, которым нужен оператор или которые вы ведёте</div></div></div>
  <div id="foot"></div>
</main>
<script>
const token=new URLSearchParams(location.search).get('token')||'';
const qs=t=>'?token='+encodeURIComponent(token)+t;
const listEl=document.getElementById('list'),colEl=document.getElementById('col'),
      mh=document.getElementById('mh'),foot=document.getElementById('foot'),statEl=document.getElementById('stat');
let queue=[],cur=null,curConv=null;
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmt(ts){return (ts||'').replace('T',' ').replace('Z','');}
const PRI={2:['p2','🔴 срочно'],1:['p1','🟠 важно'],0:['p0','🟡 обычный']};

async function jget(u){const r=await fetch(u);if(!r.ok)throw 0;return r.json();}
async function jpost(u,body){return fetch(u,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{method:'POST'});}

async function loadQueue(){
  let d;try{d=await jget('/admin/api/operator/queue'+qs(''));}catch(e){statEl.textContent='нет доступа (войдите в админку)';return;}
  queue=d.queue||[];
  statEl.textContent=`в работе: ${d.counts.pending} · ведёт оператор: ${d.counts.human}`;
  renderQueue();
}
function renderQueue(){
  if(!queue.length){listEl.innerHTML='<div style="padding:14px;color:#7c7c7c;font-size:13px">Очередь пуста 🎉</div>';return;}
  listEl.innerHTML=queue.map(c=>{
    const p=PRI[c.priority||0];
    const badges=[
      c.escalation?`<span class="b ${p[0]}">${p[1]}</span>`:'',
      c.escalation?`<span class="b ${c.auto?'auto':'man'}">${c.auto?'авто':'вручную'}</span>`:'',
      c.mode==='human'?'<span class="b human">оператор</span>':'',
      c.handled?'<span class="b done">обработано</span>':''
    ].join('');
    return `<div class="it ${cur===c.session_id?'on':''} ${c.handled?'':'unh'}" data-id="${esc(c.session_id)}">
      <div class="t">${esc(c.title||c.session_id)}</div>
      <div class="m"><span class="tag">${esc(c.channel||'—')}</span>${badges}<span>${fmt(c.updated_ts)}</span></div>
      ${c.reason?`<div class="rs">⚑ ${esc(c.reason)}</div>`:''}</div>`;
  }).join('');
}
listEl.addEventListener('click',e=>{const it=e.target.closest('.it');if(it)openConv(it.dataset.id);});

async function openConv(id){
  cur=id;renderQueue();
  let d;try{d=await jget('/admin/api/operator/conversation'+qs('&id='+encodeURIComponent(id)));}catch(e){return;}
  curConv=d.conversation||{session_id:id};
  renderHeader();renderMessages(d.messages||[]);renderFoot();
}
function renderHeader(){
  const c=curConv||{};const human=c.mode==='human';
  const p=c.priority||0;
  mh.innerHTML=`<span class="ti">${esc(c.title||c.session_id||'')}</span>`+
    (human?`<button class="btn warn" id="bRelease">↩ Вернуть боту</button>`
          :`<button class="btn pri" id="bTake">✋ Взять диалог</button>`)+
    `<select id="selPri"><option value="0"${p==0?' selected':''}>🟡 обычный</option><option value="1"${p==1?' selected':''}>🟠 важно</option><option value="2"${p==2?' selected':''}>🔴 срочно</option></select>`+
    `<button class="btn" id="bHandled">${c.handled?'↺ В работу':'✓ Обработано'}</button>`;
  const take=document.getElementById('bTake'),rel=document.getElementById('bRelease'),
        h=document.getElementById('bHandled'),sp=document.getElementById('selPri');
  if(take)take.onclick=async()=>{await jpost('/admin/api/operator/take'+qs('&id='+encodeURIComponent(cur)));openConv(cur);loadQueue();};
  if(rel)rel.onclick=async()=>{await jpost('/admin/api/operator/release'+qs('&id='+encodeURIComponent(cur)));openConv(cur);loadQueue();};
  if(h)h.onclick=async()=>{await jpost('/admin/api/operator/handled'+qs('&id='+encodeURIComponent(cur)+'&handled='+(curConv.handled?0:1)));openConv(cur);loadQueue();};
  if(sp)sp.onchange=async()=>{await jpost('/admin/api/operator/priority'+qs('&id='+encodeURIComponent(cur)+'&priority='+sp.value));loadQueue();};
}
function bubble(side,who,cls,text){
  return `<div class="row ${side}"><div class="av ${cls==='me'?'me':(cls==='op'?'op':'ai')}">${who[0]}</div>`+
         `<div style="max-width:78%"><div class="who">${who}</div><div class="bub ${cls}">${esc(text)}</div></div></div>`;
}
function renderMessages(msgs){
  if(!msgs.length){colEl.innerHTML='<div class="empty">сообщений пока нет</div>';return;}
  let html='';
  for(const m of msgs){
    if(m.user_msg) html+=`<div class="ts">${fmt(m.ts)}</div>`+bubble('me','Абитуриент','me',m.user_msg);
    if(m.assistant_msg){const op=(m.source||'').endsWith(':operator');html+=bubble('',op?'Оператор':'Бот',op?'op':'ai',m.assistant_msg);}
  }
  colEl.innerHTML=html;
  colEl.parentElement.scrollTop=colEl.parentElement.scrollHeight;
}
function renderFoot(){
  const human=(curConv||{}).mode==='human';
  if(human){
    foot.innerHTML=`<div class="composer"><textarea id="ta" placeholder="Ответ абитуриенту… (Enter — отправить, Shift+Enter — перенос)"></textarea><button class="btn pri" id="bSend">Отправить</button></div>`;
    const ta=document.getElementById('ta'),b=document.getElementById('bSend');
    const send=async()=>{const t=ta.value.trim();if(!t)return;b.disabled=true;
      await jpost('/admin/api/operator/send'+qs(''),{id:cur,text:t});ta.value='';b.disabled=false;openConv(cur);};
    b.onclick=send;
    ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
    ta.focus();
  }else{
    foot.innerHTML=`<div class="locked">Отвечает бот. Нажмите «Взять диалог», чтобы отвечать самому — бот замолчит, пока вы не вернёте диалог.</div>`;
  }
}

loadQueue();
setInterval(loadQueue,5000);
setInterval(()=>{if(cur)openConv(cur);},6000);
</script>
</body></html>
