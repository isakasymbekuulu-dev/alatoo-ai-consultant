services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST (close in firewall for prod; keep for debugging)
    volumes:
      - qdrant_data:/qdrant/storage   # persistent — survives restarts/redeploys
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - QDRANT_URL=http://qdrant:6333
    ports:
      - "8000:8000"   # public chat page + OpenAI-compatible API
    volumes:
      - ./data:/app/data
      - hf_cache:/root/.cache/huggingface   # cache BGE-M3 between restarts
    depends_on:
      qdrant:
        condition: service_started

  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    ports:
      - "3000:8080"   # staff/admin UI (login)
    environment:
      - OPENAI_API_BASE_URL=http://backend:8000/v1
      - OPENAI_API_KEY=${BACKEND_API_KEY:-sk-local-dev}
      - WEBUI_NAME=AlaToo AI Consultant
    volumes:
      - openwebui_data:/app/backend/data
    depends_on:
      - backend

volumes:
  qdrant_data:
  openwebui_data:
  hf_cache:
