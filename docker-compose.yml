services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"   # localhost only — backend reaches it via the compose network
    volumes:
      - qdrant_data:/qdrant/storage   # persistent — survives restarts/redeploys
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - QDRANT_URL=http://qdrant:6333
    ports:
      - "8000:8000"   # public chat page + OpenAI-compatible API
    volumes:
      - ./data:/app/data
      - hf_cache:/root/.cache/huggingface   # cache BGE-M3 between restarts
      - chatlogs:/app/logs                  # persistent conversation log (SQLite)
    depends_on:
      qdrant:
        condition: service_started

  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"   # nginx proxies alatoogpt.xyz here (localhost only)
    environment:
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - WEBUI_NAME=AlaToo AI Consultant
    volumes:
      - openwebui-data:/app/backend/data   # reuse EXISTING data: users, chats, model connection
    depends_on:
      - backend
    # On the same compose network as backend, so http://backend:8000/v1 always resolves
    # (this is what makes the OpenWebUI->backend link survive container recreation).

volumes:
  qdrant_data:
  hf_cache:
  chatlogs:
  openwebui-data:
    external: true   # the volume created earlier by the standalone container
